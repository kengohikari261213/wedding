<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4A1517">
<title>Kengo &amp; Hikari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Pinyon+Script&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--page:#4A1517;--paper:#F4ECDA;--ink:#5A1A1D;--sub:#8A5A55;--rule:#6E2226;--field:#FBF6EA;--onrule:#F4ECDA;--veil:42,11,13;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--page:#2A0B0D;--paper:#E9DFC9;--ink:#51171A;--sub:#7E5049;--rule:#5E1C20;--field:#F2EADA;--onrule:#F1E8D4;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page)}
body{min-height:100svh;padding:1rem;display:flex;justify-content:center;align-items:flex-start;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink)}
.card{position:relative;width:100%;max-width:28rem;min-height:calc(100svh - 2rem);background:var(--paper);border:3px solid var(--rule);padding:3.25rem 1.75rem 2.5rem;text-align:center;box-shadow:0 1.5rem 3rem rgba(0,0,0,.25)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid var(--rule);pointer-events:none}
.names{font-family:"Pinyon Script",cursive;font-size:2.6rem;line-height:1.1;margin:0;font-weight:400}
.date{font-family:"Cinzel",serif;font-size:.8rem;letter-spacing:.32em;margin:.9rem 0 0;color:var(--sub)}
.mono{width:6.5rem;height:6.5rem;margin:2.75rem auto 2.5rem;border-radius:50%;border:1px solid var(--rule);box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--rule);display:grid;place-items:center;font-family:"Pinyon Script",cursive;font-size:1.9rem;transition:transform .8s ease,opacity .8s ease}
body.opened .mono{transform:scale(1.15);opacity:0}
.label-en{font-family:"Cinzel",serif;font-size:.75rem;letter-spacing:.35em;margin:0 0 .5rem;color:var(--sub)}
label{display:block;font-size:.95rem;margin-bottom:1.25rem}
#pass{display:block;width:100%;max-width:17rem;margin:0 auto;padding:.6rem .5rem;font-family:"Cinzel","Shippori Mincho",serif;font-size:1.25rem;letter-spacing:.2em;text-indent:.2em;text-align:center;text-transform:uppercase;background:var(--field);color:var(--ink);border:0;border-bottom:1px solid var(--rule);border-radius:0}
#open{margin-top:1.75rem;font:inherit;font-size:.95rem;letter-spacing:.12em;padding:.8rem 2.25rem;border:0;border-radius:0;background:var(--rule);color:var(--onrule);cursor:pointer}
#open:disabled{opacity:.6;cursor:wait}
button:focus-visible,#pass:focus-visible{outline:1px solid var(--rule);outline-offset:4px}
#err{min-height:1.6em;font-size:.85rem;margin:1rem 0 0}
.flourish{width:3.5rem;height:1px;background:var(--rule);margin:2.5rem auto 0;opacity:.6}
/* 全画面写真 */
.hero{position:fixed;inset:0;z-index:5;background:#1a0607;transition:opacity .8s ease}
body.opened .hero{opacity:0}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel{position:absolute;left:0;right:0;text-align:center;color:#F4ECDA}
.panel-in{max-width:24rem;margin:0 auto}
.hero.bottom .panel{bottom:0;padding:5.5rem 1.5rem calc(1.75rem + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(var(--veil),0),rgba(var(--veil),.72) 32%,rgba(var(--veil),.9))}
.hero.top .panel{top:0;padding:calc(2rem + env(safe-area-inset-top)) 1.5rem 5.5rem;background:linear-gradient(to top,rgba(var(--veil),0),rgba(var(--veil),.72) 32%,rgba(var(--veil),.9))}
.hero.split .head{top:0;padding:calc(2.25rem + env(safe-area-inset-top)) 1.5rem 3rem;background:linear-gradient(to bottom,rgba(var(--veil),.5),rgba(var(--veil),0))}
.hero.split .foot{bottom:0;padding:4rem 1.5rem calc(1.75rem + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(var(--veil),0),rgba(var(--veil),.75) 40%,rgba(var(--veil),.92))}
.hero.split .date{margin-bottom:0}
.hero .mark{margin:1rem auto 0;display:flex;justify-content:center}
.hero.top .mark{margin:-.5rem auto 1.25rem}
.hero .mark img{display:block;max-height:4.5rem;max-width:9rem;width:auto;height:auto;filter:drop-shadow(0 1px 6px rgba(0,0,0,.3))}
.hero .mono-i{width:4.5rem;height:4.5rem;border-radius:50%;border:1px solid rgba(244,236,218,.85);outline:1px solid rgba(244,236,218,.85);outline-offset:-6px;display:grid;place-items:center;font-family:"Pinyon Script",cursive;font-size:1.35rem;color:#F4ECDA}
.hero .names{font-size:2.4rem;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .date{color:rgba(244,236,218,.82);margin:.6rem 0 1.5rem}
.hero label{margin-bottom:.9rem;font-size:.9rem}
.hero #pass{background:rgba(251,246,234,.96);border-bottom-color:transparent}
.hero #open{margin-top:1.1rem;background:#F4ECDA;color:#5A1A1D}
.hero button:focus-visible,.hero #pass:focus-visible{outline-color:#F4ECDA}
.hero #err{margin:.75rem 0 0;min-height:1.4em}
@media (max-height:720px){.hero .mark{margin-top:.6rem}.hero .mark img{max-height:3.25rem}.hero .mono-i{width:3.4rem;height:3.4rem;font-size:1.05rem}.hero.split .head{padding-top:calc(1.25rem + env(safe-area-inset-top));padding-bottom:2rem}.hero.split .foot{padding-top:3rem}.hero.split .date{margin-bottom:0}.hero.bottom .panel{padding-top:3.5rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}.hero.top .panel{padding-bottom:3.5rem}.hero .names{font-size:2rem}.hero .date{margin:.4rem 0 1rem}.hero label{margin-bottom:.6rem}.hero #open{margin-top:.8rem;padding:.7rem 2rem}}
@media (min-aspect-ratio:4/5){.hero-img,.hero .panel{left:50%;right:auto;width:min(100%,calc(100svh*.62));transform:translateX(-50%)}}
/* 手紙（封筒から出てくる便箋） */
#scene{--ew:min(92vw,26rem);--eh:calc(var(--ew)*.7);--eb:max(4svh,1.25rem);--ct:calc(5svh + env(safe-area-inset-top));
 position:fixed;inset:0;z-index:20;background:var(--page);overflow:hidden;opacity:0;transition:opacity .5s ease;-webkit-tap-highlight-color:transparent;color:#5A1A1D}
#scene.on{opacity:1}
.sc-top{position:absolute;left:0;right:0;top:calc(13svh + env(safe-area-inset-top));text-align:center;color:#F4ECDA;z-index:0;transition:opacity .6s ease .8s}
.sc-top .names{font-size:2.3rem}
.sc-top .date{color:rgba(244,236,218,.75);margin-top:.6rem}
#scene.go .sc-top{opacity:0}
.env{position:absolute;left:calc(50% - var(--ew)/2);bottom:var(--eb);width:var(--ew);height:var(--eh)}
.env>div{position:absolute}
.e-back{inset:0;z-index:2;background:#E4D9C2}
.e-card{z-index:3;left:6%;right:6%;bottom:9%;top:calc(var(--ct) - (100svh - var(--eb) - var(--eh)));background:#FBF7EE;box-shadow:0 -1px 12px rgba(60,20,20,.18);
 transform:translateY(calc(100svh - var(--eb) - var(--eh)*.92 - var(--ct)));transition:transform 1.2s cubic-bezier(.22,.7,.2,1) .85s}
#scene.go .e-card{transform:none}
.e-scroll{position:absolute;inset:0;overflow:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2.25rem 1.5rem calc(var(--eh)*1.02);
 -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--eh)*.98),transparent calc(100% - var(--eh)*.74));mask-image:linear-gradient(to bottom,#000 calc(100% - var(--eh)*.98),transparent calc(100% - var(--eh)*.74))}
#scene.done .e-scroll{overflow-y:auto}
.e-front{inset:0;z-index:4;pointer-events:none;filter:drop-shadow(0 -1px 1.5px rgba(90,60,30,.22))}
.e-front>div{position:absolute;inset:0}
.e-l{background:#EFE6D2;clip-path:polygon(0 0,50% 62%,0 100%)}
.e-r{background:#EFE6D2;clip-path:polygon(100% 0,50% 62%,100% 100%)}
.e-b{background:#F4EDDC;clip-path:polygon(0 100%,41% 57%,59% 57%,100% 100%)}
.e-floor{z-index:5;pointer-events:none;top:100%;left:calc(50% - 100vw);width:200vw;height:calc(var(--eb) + 4px);background:var(--page)}
.e-flap{inset:0;z-index:6;pointer-events:none;background:#ECE2CC;clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:center top;transform:perspective(1100px) rotateX(0deg)}
#scene.go .e-flap{animation:flap .8s cubic-bezier(.4,0,.2,1) .25s forwards}
@keyframes flap{0%{transform:perspective(1100px) rotateX(0deg);z-index:6}50%{z-index:6}51%{z-index:1}100%{transform:perspective(1100px) rotateX(180deg);z-index:1;background:#E2D6BD}}
.e-wax{z-index:7;pointer-events:none;left:50%;top:62%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:47% 53% 50% 50%/52% 48% 53% 47%;
 background:radial-gradient(circle at 36% 30%,#A8333F,#7E1C27 45%,#5A0F18 80%,#4A0A12);
 box-shadow:0 3px 8px rgba(40,5,10,.45),inset 0 -3px 6px rgba(30,0,5,.55),inset 0 2px 3px rgba(255,170,170,.35);
 display:grid;place-items:center;font-family:"Pinyon Script",cursive;font-size:1.05rem;color:#4A0A12;text-shadow:0 1px 0 rgba(220,120,120,.55)}
.e-wax::before{content:"";position:absolute;inset:15%;border-radius:50%;box-shadow:inset 0 1px 2px rgba(30,0,5,.7),0 1px 0 rgba(220,120,120,.45)}
#scene.final .e-flap{animation:none;transform:perspective(1100px) rotateX(180deg);z-index:1;background:#E2D6BD}
#scene.final .e-card,#scene.final .sc-top{transition:none}
/* 便箋の中身 */
.l-dear{font-family:"Pinyon Script",cursive;font-size:2rem;margin:0;text-align:center;font-weight:400;line-height:1.1}
.l-to{font-size:1.1rem;font-weight:500;letter-spacing:.06em;margin:.3rem 0 1.5rem;text-align:center}
.l-photo{display:block;width:auto;height:auto;max-width:100%;max-height:max(7rem,calc(100svh - var(--eb) - var(--ct) - var(--eh)*1.07 - 12.5rem));margin:0 auto 1.5rem;padding:5px;background:#F4ECDA;border:1px solid #C9B8A0}
.l-msg{white-space:pre-wrap;line-height:2.05;font-size:.97rem;margin:0}
.closing{margin:2rem 0 0;text-align:right}
.closing .script{font-family:"Pinyon Script",cursive;font-size:1.6rem;display:block;line-height:1.2}
.closing .sign{font-size:.95rem;letter-spacing:.08em}
.back{display:block;margin:2.25rem auto 0;background:none;border:0;color:#8A5A55;font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.25em;cursor:pointer;text-decoration:underline;text-underline-offset:.35em}
.l-hint{position:absolute;left:0;right:0;bottom:calc(var(--eb) + var(--eh)*.38 - var(--ew)*.105 - 1.5rem);z-index:8;text-align:center;font-family:"Cinzel",serif;font-size:.62rem;letter-spacing:.3em;color:#8A5A55;opacity:0;transition:opacity .5s ease;pointer-events:none}
.l-hint.show{opacity:1}
@media (prefers-reduced-motion:reduce){.mono,.hero,#scene,.sc-top,.e-card{transition:none}}
</style>
</head>

<div class="panel head"><div class="panel-in"><p class="names">Kengo &amp; Hikari</p><p class="date">2026.12.13</p><div class="mark mono-i" aria-hidden="true">K&amp;H</div></div></div>
<div class="panel foot"><div class="panel-in">
<label for="pass">席札に書かれたPASSを入力してください</label>
<input id="pass" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24" enterkeyhint="go">
<button id="open">メッセージを開く</button>
<p id="err" role="alert"></p>
</div></div>
</section>

<div id="scene" hidden>
<div class="sc-top"><p class="names">Kengo &amp; Hikari</p><p class="date">2026.12.13</p></div>
<div class="env">
<div class="e-back"></div>
<div class="e-card">
<div class="e-scroll" id="lScroll">
<p class="l-dear">Dear</p>
<p class="l-to" id="lTo"></p>
<img class="l-photo" id="lPhoto" alt="" hidden>
<p class="l-msg" id="lMsg"></p>
<p class="closing"><span class="script">with love,</span><span class="sign">賢吾・ひかり</span></p>
<button class="back" id="back">BACK</button>
</div>
</div>
<div class="e-front"><div class="e-l"></div><div class="e-r"></div><div class="e-b"></div></div>
<div class="e-floor"></div>
<div class="e-flap"></div>
<div class="e-wax" aria-hidden="true">K&amp;H</div>
</div>
<p class="l-hint" id="lHint">SCROLL ↓</p>
</div>
<script>
const SALT="eGeV+ZXgnzAdA1WIgzq8FA==",ITER=200000;
const enc=new TextEncoder(),dec=new TextDecoder(),$=id=>document.getElementById(id);
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function normalize(p){return String(p||"").normalize("NFKC").replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toUpperCase().replace(/[\s\-ー－・]/g,"");}
async function derive(pass){
 const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:fromB64(SALT),iterations:ITER,hash:"SHA-256"},km,512));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-GCM",false,["decrypt"]);
 return {key,id:[...bits.slice(32,44)].map(b=>b.toString(16).padStart(2,"0")).join("")};
}
let t1,t2;
function updHint(){const s=$("lScroll");$("lHint").classList.toggle("show",$("scene").classList.contains("done")&&s.scrollHeight-s.clientHeight>24&&s.scrollTop<16);}
$("lScroll").addEventListener("scroll",updHint,{passive:true});
function toTop(){$("lScroll").scrollTop=0;window.scrollTo(0,0);}
function finish(){const sc=$("scene");clearTimeout(t1);clearTimeout(t2);if(!sc.classList.contains("done"))toTop();sc.classList.add("on","go","final","done");updHint();}
function playLetter(m){
 const sc=$("scene");
 $("lTo").textContent=m.to+" さんへ";$("lMsg").textContent=m.message;
 if(m.photo){$("lPhoto").src=m.photo;$("lPhoto").hidden=false;}else{$("lPhoto").hidden=true;$("lPhoto").removeAttribute("src");}
 $("lHint").classList.remove("show");
 sc.className="";sc.hidden=false;document.body.style.overflow="hidden";toTop();
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){finish();return;}
 requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add("on")));
 t1=setTimeout(()=>sc.classList.add("go"),600);
 t2=setTimeout(()=>{toTop();sc.classList.add("done");updHint();},600+2100);
}
$("scene").addEventListener("click",e=>{if(!$("scene").classList.contains("done"))finish();});
async function openLetter(){
 const p=normalize($("pass").value);$("err").textContent="";
 if(!p){$("err").textContent="PASSを入力してください。";return;}
 $("open").disabled=true;$("open").textContent="確認中…";
 try{
  const {key,id}=await derive(p);
  const r=await fetch("data/"+id+".json",{cache:"no-store"});
  if(!r.ok)throw new Error("nf");
  const d=await r.json();
  const m=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(d.iv)},key,fromB64(d.ct))));
  document.activeElement&&document.activeElement.blur();
  document.body.classList.add("opened");
  playLetter(m);
 }catch(e){
  $("err").textContent="PASSが一致しません。席札の文字をもう一度確認してください。";
 }finally{$("open").disabled=false;$("open").textContent="メッセージを開く";}
}
$("open").onclick=openLetter;
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")openLetter();});
$("back").onclick=e=>{e.stopPropagation();const sc=$("scene");$("lScroll").scrollTop=0;sc.hidden=true;sc.className="";$("lPhoto").removeAttribute("src");document.body.style.overflow="";document.body.classList.remove("opened");$("pass").value="";$("pass").focus();};
</script>
